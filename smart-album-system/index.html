<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能相册系统 - 主页</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Specific Styles for Dashboard */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }

        .stat-card {
            background: white;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            font-size: 48px;
            color: var(--primary-color);
            background: rgba(64, 158, 255, 0.1);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stat-info h3 {
            font-size: 16px;
            color: #909399;
            margin-bottom: 10px;
        }

        .stat-info .number {
            font-size: 32px;
            font-weight: bold;
            color: #303133;
        }

        .recent-section {
            margin-top: 30px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #EBEEF5;
            padding-bottom: 15px;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }

        .photo-item {
            aspect-ratio: 4/3;
            background-color: #f0f2f5;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .photo-item:hover img {
            transform: scale(1.05);
        }

        .storage-bar {
            height: 10px;
            background-color: #EBEEF5;
            border-radius: 5px;
            margin-top: 10px;
            overflow: hidden;
        }

        .storage-progress {
            height: 100%;
            background-color: var(--success-color);
            width: 45%; /* Simulated value */
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <!-- Top Navigation -->
    <header class="header">
        <div class="logo">
            <span style="font-size: 24px;">📸</span> 智能相册系统
        </div>
        <nav class="nav-menu">
            <a href="index.html" class="nav-item active">主页</a>
            <a href="camera.html" class="nav-item">拍照</a>
            <a href="gallery.html" class="nav-item">浏览</a>
            <a href="editor.html" class="nav-item">编辑</a>
            <a href="settings.html" class="nav-item">设置</a>
        </nav>
    </header>

    <div class="container">
        <!-- Left Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-item active">
                <span>📊</span> 概览
            </div>
            <a href="gallery.html" class="sidebar-item">
                <span>❤️</span> 我的收藏
            </a>
            <a href="gallery.html" class="sidebar-item">
                <span>🕒</span> 最近添加
            </a>
            <div style="margin-top: auto; padding: 10px; background: #f0f2f5; border-radius: 6px;">
                <div style="font-size: 12px; color: #606266; margin-bottom: 5px;">存储空间 (45%)</div>
                <div class="storage-bar">
                    <div class="storage-progress" style="width: 45%;"></div>
                </div>
                <div style="font-size: 12px; color: #909399; margin-top: 5px; text-align: right;">45GB / 100GB</div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <h2>欢迎回来，用户</h2>
            
            <div class="dashboard-grid">
                <div class="stat-card">
                    <div class="stat-info">
                        <h3>照片总数</h3>
                        <div class="number" id="totalPhotos">0</div>
                    </div>
                    <div class="stat-icon">📷</div>
                </div>
                <div class="stat-card">
                    <div class="stat-info">
                        <h3>最近添加</h3>
                        <div class="number" id="recentAdded">0</div>
                    </div>
                    <div class="stat-icon" style="color: #67C23A; background: rgba(103, 194, 58, 0.1);">📅</div>
                </div>
                <div class="stat-card">
                    <div class="stat-info">
                        <h3>视频作品</h3>
                        <div class="number" id="videoCount">0</div>
                    </div>
                    <div class="stat-icon" style="color: #E6A23C; background: rgba(230, 162, 60, 0.1);">🎬</div>
                </div>
            </div>

            <!-- Recent Photos -->
            <div class="recent-section">
                <div class="section-header">
                    <h3>最近拍摄</h3>
                    <a href="gallery.html" style="color: var(--primary-color); text-decoration: none;">查看全部 ></a>
                </div>
                <div class="photo-grid" id="recentPhotos">
                    <!-- Photos will be populated by JS -->
                </div>
            </div>
        </main>
    </div>

    <script>
        // Fetch real data from backend
        async function fetchDashboardData() {
            try {
                const response = await fetch('http://localhost:5000/get_photos');
                const result = await response.json();
                const photos = result.photos || [];
                
                // Update Statistics
                document.getElementById('totalPhotos').textContent = photos.length;
                
                const videos = photos.filter(p => p.type === 'video');
                document.getElementById('videoCount').textContent = videos.length;
                
                // Calculate photos added in last 7 days
                const now = new Date();
                const sevenDaysAgo = new Date(now.getTime() - (7 * 24 * 60 * 60 * 1000));
                const recentPhotos = photos.filter(p => {
                    const created = new Date(p.created_at);
                    return created > sevenDaysAgo;
                });
                document.getElementById('recentAdded').textContent = recentPhotos.length;

                // Populate Recent Photos (Top 4)
                const photoGrid = document.getElementById('recentPhotos');
                photoGrid.innerHTML = '';
                
                const top4 = photos.slice(0, 4);
                if (top4.length === 0) {
                    photoGrid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 20px; color: #909399;">暂无最近照片</div>';
                } else {
                    top4.forEach(photo => {
                        const div = document.createElement('div');
                        div.className = 'photo-item';
                        div.onclick = () => window.location.href = 'gallery.html';
                        
                        if (photo.type === 'video') {
                            div.innerHTML = `
                                <video src="${photo.url}" style="width: 100%; height: 100%; object-fit: cover;"></video>
                                <span style="font-size: 30px; color: white; opacity: 0.8; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">▶</span>
                            `;
                        } else {
                            div.innerHTML = `<img src="${photo.url}" alt="Recent Photo">`;
                        }
                        photoGrid.appendChild(div);
                    });
                }

                // Update Storage Bar (Simulation based on count)
                const storagePercent = Math.min(Math.round((photos.length / 500) * 100), 100);
                document.querySelector('.storage-progress').style.width = storagePercent + '%';
                document.querySelector('.storage-bar').previousElementSibling.textContent = `存储空间 (${storagePercent}%)`;
                document.querySelector('.storage-bar').nextElementSibling.textContent = `${photos.length} / 500 张照片`;

            } catch (err) {
                console.error("Failed to fetch dashboard data:", err);
            }
        }

        // Add simple interaction for nav items
        document.querySelectorAll('.sidebar-item').forEach(item => {
            item.addEventListener('click', function() {
                if(!this.getAttribute('href')) { // Only for non-links
                    document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
                    this.classList.add('active');
                }
            });
        });

        // Initialize
        fetchDashboardData();
    </script>
</body>
</html>
